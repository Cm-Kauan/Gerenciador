spring.application.name=tasksync-backend

# Perfil padrao: pensado para producao (Railway).
# Railway injeta DATABASE_URL, PGUSER e PGPASSWORD como variaveis de ambiente
# quando o plugin do Postgres eh adicionado ao projeto.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
