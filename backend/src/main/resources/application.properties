spring.application.name=tasksync-backend

# Perfil padrao: pensado para producao (Railway).
# JDBC_DATABASE_URL, DB_USERNAME e DB_PASSWORD sao variaveis que nos mesmos
# configuramos no painel do Railway (ver README), referenciando o plugin do
# Postgres. Nao usamos a variavel DATABASE_URL que o Railway gera automaticamente
# porque ela vem no formato "postgres://usuario:senha@host:porta/banco",
# e o driver JDBC exige o formato "jdbc:postgresql://host:porta/banco".
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# O frontend usa nomes de campo em snake_case (due_date, goal_target, ...).
# Essa estrategia faz o Jackson converter automaticamente os nomes camelCase
# das classes Java (dueDate, goalTarget, ...) sem precisar anotar cada campo.
spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=${PORT:8080}

# JWT_SECRET deve ser configurada como variavel de ambiente no Railway
# (uma string aleatoria em base64 - gere a sua com: openssl rand -base64 32).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Envio de e-mail (codigo de verificacao) via SMTP do Brevo.
# BREVO_SMTP_USER e BREVO_SMTP_PASSWORD vem do painel do Brevo
# (SMTP & API > SMTP). MAIL_FROM deve ser um remetente verificado no Brevo.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
