<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSync</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>TaskSync</h1>
        <p class="subtitle">Plataforma de gestão de tarefas pessoais e profissionais.</p>

        <section class="card">
            <h2>Status do backend</h2>
            <button id="check-health-btn">Testar conexão com o backend</button>
            <pre id="health-result">Clique no botão para testar.</pre>
        </section>

        <section class="card" id="auth-section">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login-tab">Entrar</button>
                <button class="tab-btn" data-tab="register-tab">Criar conta</button>
            </div>

            <form id="login-tab" class="tab-content active">
                <h2>Entrar</h2>
                <label>
                    E-mail
                    <input type="email" id="login-email" required>
                </label>
                <label>
                    Senha
                    <input type="password" id="login-password" required>
                </label>
                <button type="submit">Entrar</button>
            </form>

            <form id="register-tab" class="tab-content">
                <h2>Criar conta</h2>
                <label>
                    Nome
                    <input type="text" id="register-name" required>
                </label>
                <label>
                    E-mail
                    <input type="email" id="register-email" required>
                </label>
                <label>
                    Senha (mínimo 6 caracteres)
                    <input type="password" id="register-password" minlength="6" required>
                </label>
                <button type="submit">Criar conta</button>
            </form>

            <pre id="auth-result">Faça login ou crie uma conta.</pre>
        </section>

        <section class="card">
            <h2>Área logada</h2>
            <p id="logged-user-info">Você ainda não está logado.</p>
            <button id="check-me-btn">Consultar /api/me</button>
            <button id="logout-btn">Sair</button>
            <pre id="me-result"></pre>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
